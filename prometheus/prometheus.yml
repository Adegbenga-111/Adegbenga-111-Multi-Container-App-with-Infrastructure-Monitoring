# -------------------------------------------------------------------------
# GLOBAL CONFIGURATION
# -------------------------------------------------------------------------
# These settings apply universally to all monitoring jobs defined in this file.
global:
  # How often Prometheus will scrape (pull) metrics from your target containers.
  # 15 seconds is the industry standard for development and testing.
  scrape_interval: 15s

  # How long Prometheus will wait for a target container to respond before timing out.
  scrape_timeout: 10s

  # How often Prometheus will evaluate its internal alerting rules (if configured).
  evaluation_interval: 15s

# -------------------------------------------------------------------------
# SCRAPE CONFIGURATIONS
# -------------------------------------------------------------------------
# This section defines the specific endpoints (jobs) Prometheus will monitor.
scrape_configs:

  # --- JOB 1: Monitor Prometheus Itself ---
  - job_name: 'prometheus'
    # Metrics path defaults to '/metrics' if not explicitly defined.
    metrics_path: /metrics
    # Scheme defaults to 'http' if not explicitly defined.
    scheme: http
    # Static configurations allow you to manually specify the target addresses.
    static_configs:
      # Prometheus monitors its own internal performance metrics on port 9090.
      # Since it is running inside itself, it can target 'localhost'.
      - targets: ['localhost:9090']

  # --- JOB 2: Monitor Container Infrastructure via cAdvisor ---
  - job_name: 'cadvisor'
    scrape_interval: 60s
    scrape_timeout: 50s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'backend'
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets: ['backend:8000']

  # --- MongoDB metrics via the exporter ---
  - job_name: 'mongodb'
    scrape_interval: 30s
    scrape_timeout: 20s       # longer timeout for a slow host
    static_configs:
      - targets: ['mongodb-exporter:9216']